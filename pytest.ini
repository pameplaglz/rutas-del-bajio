[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unitaria: pruebas unitarias aisladas de modelos, validaciones y reglas de limpieza
    integracion: pruebas que verifican persistencia CSV, llaves foráneas y procesamiento de lotes
    aceptacion: pruebas de extremo a extremo del flujo completo de negocio y demostración
